[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "opendatacrawler"
version = "2.3.0"
description = "Crawler for open data portals"
authors = [
  { name="Alberto Berenguer Pastor", email="alberto.berenguer@ua.es" },
  { name="Paula Margarita García-Tapia Mateo", email="paula.garciatapia@ua.es"}
]
requires-python = ">=3.12"
dependencies = [
  "requests",
  "tqdm",
  "humanize",
  "frictionless",
  "chardet",
  "beautifulsoup4",
  "w3lib",
  "url-normalize",
  "olefile",
  "python-magic",
  "ftfy",
  "pycountry"
]

[project.scripts]
opendatacrawler = "opendatacrawler.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["opendatacrawler", "opendatacrawler.*"]

[tool.setuptools.package-data]
opendatacrawler = ["config.example.ini", "resources/*.json", "resources/*.txt"]

[tool.setuptools.exclude-package-data]
opendatacrawler = ["config.ini", "resources/*.csv", "resources/zenodo_state.json", "resources/*catalog*.json"]
